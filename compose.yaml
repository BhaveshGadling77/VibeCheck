services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-vibecheck_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vibecheck-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-vibecheck_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-vibecheck-local}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
      MIN_MATCHES: ${MIN_MATCHES:-8}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/songs:/app/backend/songs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mobile:
    profiles: ["mobile"]
    build:
      context: ./app
      dockerfile: Dockerfile
    network_mode: host
    env_file:
      - ./app/.env
    environment:
      EXPO_NO_TELEMETRY: "1"
    volumes:
      - ./app:/app
      - expo_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  expo_node_modules:
